<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- Preload the LCP hero image per breakpoint (public paths are stable, not
         hashed). type=image/avif → browsers without AVIF skip it and load the
         WebP/PNG fallback from <picture> normally, so nothing is wasted.
         NOTE: no desktop preload — the ≥1024 hero is copy over a shader band,
         it renders no hero-dashboard image at all. -->
    <link rel="preload" as="image" type="image/avif" href="/figma/tablet/hero-dashboard.avif" media="(min-width: 640px) and (max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/figma/phone/hero-mockup.avif" media="(max-width: 639px)" fetchpriority="high" />
    <meta
      name="description"
      content="LoadHunter OS — book better loads before anyone else. AI-powered dispatch tools that book loads in under 30 seconds."
    />
    <title>LoadHunter OS — Book better loads before anyone else</title>
    <!-- NO untyped PNG preload here: an AVIF-capable browser would fetch BOTH
         the AVIF above and the PNG (up to ~950 KB wasted). The rare non-AVIF
         browser simply loads its fallback via <picture> without a preload. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
