<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- No LCP image preload: on every breakpoint the hero is copy over a
         background (shader band on desktop, gradient on mobile) — it renders
         no hero image at all. -->
    <meta
      name="description"
      content="LoadHunter OS — book better loads before anyone else. AI-powered dispatch tools that book loads in under 30 seconds."
    />
    <title>LoadHunter OS — Book better loads before anyone else</title>

    <link rel="canonical" href="https://loadhunter.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LoadHunter" />
    <meta property="og:url" content="https://loadhunter.io/" />
    <meta property="og:title" content="LoadHunter OS — Book better loads before anyone else" />
    <meta
      property="og:description"
      content="AI copilot for freight dispatchers: smart-board view, auto-emailing, Telegram alerts and a profit calculator — book loads in under a minute."
    />
    <meta property="og:image" content="https://loadhunter.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LoadHunter — Book better loads before anyone else" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoadHunter OS — Book better loads before anyone else" />
    <meta
      name="twitter:description"
      content="AI copilot for freight dispatchers: smart-board view, auto-emailing, Telegram alerts and a profit calculator — book loads in under a minute."
    />
    <meta name="twitter:image" content="https://loadhunter.io/og-image.png" />
    <!-- NO untyped PNG preload here: an AVIF-capable browser would fetch BOTH
         the AVIF above and the PNG (up to ~950 KB wasted). The rare non-AVIF
         browser simply loads its fallback via <picture> without a preload. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
